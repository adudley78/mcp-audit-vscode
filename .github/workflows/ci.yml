name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @vscode/vsce requires Node >= 20 (undici dependency)
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (production)
        run: node esbuild.js --production

      - name: Compile tests
        run: npm run compile-tests

      - name: Run tests (Linux — needs Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm test

      - name: Package VSIX (packaging regression check)
        run: npx vsce package --no-dependencies

      - name: Verify VSIX size ≤ 2 MB
        shell: bash
        run: |
          VSIX=$(ls *.vsix | head -1)
          SIZE=$(wc -c < "$VSIX")
          echo "VSIX: $VSIX — ${SIZE} bytes"
          if [ "$SIZE" -gt 2097152 ]; then
            echo "ERROR: VSIX exceeds 2 MB (${SIZE} bytes)" >&2
            exit 1
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: mcp-audit-vscode-${{ github.sha }}.vsix
          path: '*.vsix'
          retention-days: 14
