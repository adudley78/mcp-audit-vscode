name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# The token of each job can only read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # @vscode/test-electron 3.x requires Node >= 22 (it finds the macOS binary that VS Code 1.110 renamed)
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (production)
        run: node esbuild.js --production

      - name: Compile tests
        run: npm run compile-tests

      - name: Run tests (Linux — needs Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm test

      - name: Package VSIX (packaging regression check)
        run: npx vsce package --no-dependencies

      - name: Verify VSIX size ≤ 2 MB
        shell: bash
        run: |
          VSIX=$(ls *.vsix | head -1)
          SIZE=$(wc -c < "$VSIX")
          echo "VSIX: $VSIX — ${SIZE} bytes"
          if [ "$SIZE" -gt 2097152 ]; then
            echo "ERROR: VSIX exceeds 2 MB (${SIZE} bytes)" >&2
            exit 1
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: mcp-audit-vscode-${{ github.sha }}.vsix
          path: '*.vsix'
          retention-days: 14

  # The extension against the real command. The unit tests read saved answers;
  # this job installs Credenzo from PyPI and starts it, so a release that
  # changes the answer fails here.
  contract:
    name: Contract test with the real credenzo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Credenzo from PyPI
        run: |
          python -m pip install --disable-pip-version-check credenzo
          credenzo version

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile-tests

      - name: Contract test
        env:
          CREDENZO_PYTHON: python
        run: node scripts/contract-test.mjs credenzo
